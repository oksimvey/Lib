name: Lib - Windows Self-Hosted Rojo CI

# This personal runner executes only trusted branch pushes / manual dispatch.
# A partial RBXM is never automatically published as a full Place.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lib-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package Lib
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SHA-256-verified Windows Rojo and Luau
        run: .\scripts\ci\setup-windows-tools.ps1

      - name: Validate Rojo development mapping (not for publication)
        run: rojo build default.project.json --output validation.rbxlx

      - name: Build incremental RBXM model
        run: rojo build deploy.project.json --output Lib.rbxm

      - name: Upload installable model
        uses: actions/upload-artifact@v4
        with:
          name: lib-rbxm
          path: Lib.rbxm
          if-no-files-found: error

      - name: Compile exactly the managed Luau sources
        run: .\scripts\azul\sync-from-github.ps1 -ValidateOnly

      - name: Parse and validate Azul bridge PowerShell
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/azul/sync-from-github.ps1').Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { throw ($errors | ForEach-Object Message | Out-String) }

  live-sync:
    name: Validated git pull -> isolated Azul Live Sync
    needs: build
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout bridge automation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull validated revision and project managed scripts
        env:
          AZUL_PROJECT_DIR: ${{ vars.AZUL_PROJECT_DIR }}
          AZUL_PORT: ${{ vars.AZUL_PORT }}
          AZUL_EXPECTED_BRANCH: master
          AZUL_PULL_TOKEN: ${{ github.token }}
        run: |
          $dir = if ($env:AZUL_PROJECT_DIR) { $env:AZUL_PROJECT_DIR } else { 'C:\Roblox\Lib' }
          $port = if ($env:AZUL_PORT) { [int]$env:AZUL_PORT } else { 8104 }
          .\scripts\azul\sync-from-github.ps1 -ProjectDir $dir -Port $port
